<!doctype html>
<html><head><meta charset="utf-8"><title>Voxel render harness</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { createStage } from './src/stage.js';
import { CHARACTERS } from './src/characters.js';
import { CLIPS } from './src/clips.js';
import { Character } from './src/rig.js';

let stage = null; const chars = {};
window.setup = ({ width = 1024, height = 1024, background = null, camera } = {}) => {
  if (stage) { stage.renderer.dispose(); stage.renderer.domElement.remove(); }
  stage = createStage({ width, height, transparent: !background, background });
  document.body.appendChild(stage.renderer.domElement);
  if (camera) { stage.camera.position.set(...camera.pos); stage.camera.lookAt(...camera.target); if (camera.fov) { stage.camera.fov = camera.fov; stage.camera.updateProjectionMatrix(); } }
  for (const k in chars) delete chars[k];
  return true;
};
// layout: [{id, clip, t, x, z, ry, face, pose}]
window.renderScene = (items) => {
  for (const c of Object.values(chars)) c.root.visible = false;
  items.forEach((it, i) => {
    const key = it.id + '#' + (it.slot ?? i);
    let ch = chars[key];
    if (!ch) { ch = chars[key] = new Character(CHARACTERS[it.id]); stage.scene.add(ch.root); }
    ch.root.visible = true;
    ch.root.position.set(it.x || 0, 0, it.z || 0);
    ch.root.rotation.y = (it.ry || 0) * Math.PI / 180;
    const clip = it.clipObj || CLIPS[it.clip || 'idle'];
    ch.update(clip, it.t || 0, { mouth: it.mouth });
    if (it.face) ch.setFace(it.face);
  });
  stage.render();
  return stage.renderer.domElement.toDataURL('image/png');
};
window.ready = true;
</script></body></html>
