<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:2560px;height:1440px;overflow:hidden;background:#05040f}
#c{position:relative;width:2560px;height:1440px;font-family:'Inter Display','Inter',sans-serif}
svg{position:absolute;inset:0}
.safe{position:absolute;left:507px;top:509px;width:1546px;height:423px}
.text{position:absolute;left:470px;top:50%;transform:translateY(-50%);right:0}
.kicker{font:600 26px 'Inter';letter-spacing:10px;color:#9fe8ff;text-transform:uppercase;opacity:.9}
h1{font:900 150px/1 'Inter Display';letter-spacing:2px;margin-top:10px;white-space:nowrap;
 background:linear-gradient(90deg,#ffffff 0%,#ffe2b0 45%,#ff9a5a 100%);-webkit-background-clip:text;color:transparent;
 filter:drop-shadow(0 6px 30px rgba(255,140,60,.45))}
.tag{font:600 36px 'Inter';color:#e9e6ff;margin-top:18px;letter-spacing:.5px}
.tag b{color:#ffb36b;font-weight:800}
.chips{display:flex;gap:14px;margin-top:28px;flex-wrap:nowrap}
.chip{font:600 25px 'Inter';color:#fff;padding:11px 20px;border-radius:40px;
 background:rgba(255,255,255,.07);border:1.5px solid rgba(160,220,255,.35);white-space:nowrap;
 box-shadow:0 0 20px rgba(120,180,255,.12) inset}
.chip span{font-family:'Noto Color Emoji';margin-right:8px}
</style></head><body><div id="c">
<svg width="2560" height="1440" viewBox="0 0 2560 1440">
<defs>
 <radialGradient id="bg" cx="50%" cy="50%" r="75%">
  <stop offset="0" stop-color="#1e1250"/><stop offset=".45" stop-color="#0d0a2b"/><stop offset="1" stop-color="#03020a"/>
 </radialGradient>
 <radialGradient id="neb1" cx="25%" cy="35%" r="35%"><stop offset="0" stop-color="#7a2bd6" stop-opacity=".55"/><stop offset="1" stop-color="#7a2bd6" stop-opacity="0"/></radialGradient>
 <radialGradient id="neb2" cx="80%" cy="65%" r="35%"><stop offset="0" stop-color="#0fa4c8" stop-opacity=".45"/><stop offset="1" stop-color="#0fa4c8" stop-opacity="0"/></radialGradient>
 <radialGradient id="neb3" cx="15%" cy="85%" r="30%"><stop offset="0" stop-color="#ff5a2a" stop-opacity=".45"/><stop offset="1" stop-color="#ff5a2a" stop-opacity="0"/></radialGradient>
 <radialGradient id="portal" cx="50%" cy="50%" r="50%">
  <stop offset="0" stop-color="#fff6e0"/><stop offset=".25" stop-color="#ffc070"/><stop offset=".55" stop-color="#ff6a2a" stop-opacity=".8"/><stop offset=".8" stop-color="#8a2be2" stop-opacity=".35"/><stop offset="1" stop-color="#3a1a8a" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7ff0ff"/><stop offset=".5" stop-color="#b16bff"/><stop offset="1" stop-color="#ff8a3d"/></linearGradient>
 <radialGradient id="planet" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#6fd6ff"/><stop offset=".5" stop-color="#2a4fb0"/><stop offset="1" stop-color="#0a0a30"/></radialGradient>
 <radialGradient id="moon" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffd2a8"/><stop offset=".6" stop-color="#c0503a"/><stop offset="1" stop-color="#3a0e18"/></radialGradient>
 <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#120a2a"/><stop offset="1" stop-color="#030208"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="2560" height="1440" fill="url(#bg)"/>
<rect width="2560" height="1440" fill="url(#neb1)"/>
<rect width="2560" height="1440" fill="url(#neb2)"/>
<rect width="2560" height="1440" fill="url(#neb3)"/>
<g id="stars"></g>
<!-- planet top right -->
<circle cx="2240" cy="260" r="210" fill="url(#planet)"/>
<ellipse cx="2240" cy="270" rx="360" ry="60" fill="none" stroke="#9fe8ff" stroke-opacity=".5" stroke-width="6" transform="rotate(-14 2240 270)"/>
<!-- red moon top left -->
<circle cx="330" cy="230" r="110" fill="url(#moon)"/>
<!-- left: ruined city (apocalypse) -->
<g fill="#0a0618">
 <path d="M0 1440 V1010 h60 v-120 h20 v-40 h40 v160 h50 v-260 l30 -30 l20 40 v250 h60 v-180 h70 v120 l20 -30 v-60 h80 v230 h50 v-90 h60 v170 h40 V1440 Z"/>
</g>
<g fill="#ffb060" opacity=".7">
 <rect x="130" y="900" width="8" height="12"/><rect x="200" y="760" width="8" height="12"/><rect x="220" y="820" width="8" height="12"/>
 <rect x="320" y="880" width="8" height="12"/><rect x="420" y="980" width="8" height="12"/><rect x="450" y="900" width="8" height="12"/>
</g>
<!-- right: futuristic towers -->
<g fill="#07101f">
 <path d="M1960 1440 V1060 h50 v-80 h30 v-210 l25 -60 l25 60 v210 h30 v100 h70 v-160 h80 v-110 h20 v-60 h10 v60 h20 v110 h40 v240 h60 v-120 l40 -40 l40 40 v130 h40 V1440 Z"/>
</g>
<g fill="#7ff0ff" opacity=".8">
 <rect x="2058" y="800" width="4" height="200"/><rect x="2250" y="890" width="60" height="4"/><rect x="2250" y="930" width="60" height="4"/>
 <rect x="2440" y="1060" width="4" height="120"/><rect x="2210" y="1000" width="40" height="4"/>
</g>
<circle cx="2290" cy="770" r="6" fill="#ff4a6a" filter="url(#glow)"/>
<!-- ground -->
<path d="M0 1200 Q1280 1080 2560 1200 V1440 H0Z" fill="url(#ground)"/>
<!-- portal glow behind hero (inside safe area, left) -->
<circle cx="720" cy="720" r="320" fill="#ff7a3a" opacity=".25" filter="url(#blur)"/>
<circle cx="720" cy="720" r="200" fill="url(#portal)"/>
<circle cx="720" cy="720" r="200" fill="none" stroke="url(#ring)" stroke-width="10" filter="url(#glow)"/>
<circle cx="720" cy="720" r="228" fill="none" stroke="url(#ring)" stroke-width="3" stroke-dasharray="40 18 6 18" opacity=".8"/>
<circle cx="720" cy="720" r="256" fill="none" stroke="#7ff0ff" stroke-width="2" stroke-dasharray="2 14" opacity=".6"/>
<!-- hero silhouette (back view, cape) -->
<g fill="#06030f" transform="translate(720 935)">
 <ellipse cx="0" cy="0" rx="120" ry="14" fill="#000" opacity=".5"/>
 <path d="M-12 -2 L-16 -110 L-34 -112 L-30 -200 Q-40 -235 -24 -250 L24 -250 Q40 -235 30 -200 L34 -112 L16 -110 L12 -2 L4 -2 L2 -100 L-2 -100 L-4 -2Z"/>
 <path d="M-26 -248 Q-70 -150 -88 -6 L-40 -40 L-10 -110 Z"/>
 <path d="M26 -248 Q62 -160 70 -10 L36 -60 L12 -110 Z"/>
 <circle cx="0" cy="-272" r="22"/>
 <rect x="-8" y="-254" width="16" height="10"/>
</g>
</svg>
<div class="safe">
 <div class="text">
  <div class="kicker">Новые истории · Новые миры</div>
  <h1>ОДИН ГЕРОЙ</h1>
  <div class="tag">Неожиданные концовки. <b>Скучно не будет!</b></div>
  <div class="chips">
   <div class="chip"><span>🌌</span>Фантастика</div>
   <div class="chip"><span>🧟</span>Апокалипсис</div>
   <div class="chip"><span>🌀</span>Необычное</div>
   <div class="chip"><span>🤖</span>Будущее</div>
  </div>
 </div>
</div>
</div>
<script>
const g=document.getElementById('stars');let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
let h='';for(let i=0;i<420;i++){const x=r()*2560,y=r()*1150,rad=r()<.92?r()*1.6+.4:r()*2.5+1.5,o=.3+r()*.7;
h+=`<circle cx="${x}" cy="${y}" r="${rad}" fill="#fff" opacity="${o}"/>`}g.innerHTML=h;
</script>
</body></html>
